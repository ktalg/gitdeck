name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GIT_AUTHOR_NAME: gitdeck-ci
      GIT_AUTHOR_EMAIL: ci@gitdeck.invalid
      GIT_COMMITTER_NAME: gitdeck-ci
      GIT_COMMITTER_EMAIL: ci@gitdeck.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib
      - run: mkdir -p .tmp && touch .tmp/suite-run-stamp
      - run: cargo test --workspace --test suite -- --nocapture
      - run: cargo test -p gitdeck-cli --test e2e -- --test-threads=${{ runner.os == 'macOS' && 1 || 2 }} --nocapture
        env:
          TERM: xterm-256color
      - run: bash scripts/collect-screenshots.sh

  build-windows:
    name: build (windows-latest)
    runs-on: windows-latest
    env:
      GIT_AUTHOR_NAME: gitdeck-ci
      GIT_AUTHOR_EMAIL: ci@gitdeck.invalid
      GIT_COMMITTER_NAME: gitdeck-ci
      GIT_COMMITTER_EMAIL: ci@gitdeck.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace --lib
