[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ktalg/gitdeck"
description = "A terminal Git client that mirrors the JetBrains Git tool windows"

[workspace.dependencies]
gitdeck-app = { path = "crates/gitdeck-app" }
gitdeck-caps = { path = "crates/gitdeck-caps" }
gitdeck-core = { path = "crates/gitdeck-core" }
gitdeck-git = { path = "crates/gitdeck-git" }
gitdeck-testkit = { path = "crates/gitdeck-testkit" }
gitdeck-tui = { path = "crates/gitdeck-tui" }
font8x8 = "0.3.1"
insta = "1.49.0"
png = "0.17.16"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-width = "0.2.3"
vt100 = "0.15.2"
